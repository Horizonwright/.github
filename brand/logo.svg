<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E141B"/><stop offset="1" stop-color="#06090D"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.35"/><stop offset="0.35" stop-color="#22D3C5"/><stop offset="1" stop-color="#67F0FF"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <g transform="translate(10 0)">
  <!-- horizon beam = the H's crossbar, running out past the structure -->
  <rect x="64" y="290" width="324" height="24" rx="3" fill="url(#beam)" filter="url(#glow)" opacity="0.6"/>
  <rect x="64" y="290" width="324" height="24" rx="3" fill="url(#beam)"/>
  <!-- the H: two pillars; the right one carries the wright's chamfer -->
  <rect x="104" y="128" width="64" height="256" rx="6" fill="#EEF2F6"/>
  <path d="M250 134 a6 6 0 0 1 6 -6 h22 l42 42 v208 a6 6 0 0 1 -6 6 h-58 a6 6 0 0 1 -6 -6 z" fill="#EEF2F6"/>
  <!-- cursor: the build is never finished -->
  <rect x="404" y="262" width="24" height="52" rx="3" fill="#67F0FF"/>
</g>
</svg>
