name: Feature request
description: A new capability or an improvement
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why? What's painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include acceptance criteria if you can.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives considered, designs, links.
